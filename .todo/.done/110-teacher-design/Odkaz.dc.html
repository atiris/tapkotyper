        <ul style="list-style: none; margin: 0; padding: 0; flex: 1; overflow: auto; border: 1px solid rgba(90,61,43,0.18); border-radius: 12px; background: #fff">

            <button type="button" aria-label="Zrušiť tento výsledok" style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgba(90,61,43,0.3); background: transparent; color: #6b5a70"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
          </li>
        </ul>
        <div style="display: flex; gap: 12px">
          <a href="Main.dc.html" style="flex: 1; height: 52px; border-radius: 999px; border: 1px solid rgba(90,61,43,0.42); background: #fffdf7; color: #3b2a3f; font: 700 17px Lexend, sans-serif; box-shadow: 0 4px 0 rgba(90,61,43,0.18); display: flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box">Zrušiť</a>

        </div>
      </div>
    </section>
  </main>
</div>
