<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Pre učiteľov – Úlohy (mobil)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ad4f0e}a:hover{color:#7a2d00}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Lexend, system-ui, sans-serif; color: #3b2a3f; background: #fffdf7; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #cfe9f7">
    <button type="button" aria-label="Späť" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(90,61,43,0.42); background: #fffdf7; font: 600 18px Lexend, sans-serif; color: #3b2a3f">‹</button>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700">Pre učiteľov</h1>
  </header>
  <nav aria-label="Časti" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 2px solid rgba(90,61,43,0.12)">
    <a href="MobilVysledky.dc.html" style="padding: 12px 0; text-align: center; font-weight: 600; font-size: 14px; color: #6b5a70; text-decoration: none">Výsledky</a>
    <a href="MobilHodnotenie.dc.html" style="padding: 12px 0; text-align: center; font-weight: 600; font-size: 14px; color: #6b5a70; text-decoration: none">Hodnotenie</a>
    <a href="MobilUlohy.dc.html" style="padding: 12px 0; text-align: center; font-weight: 700; font-size: 14px; color: #3b2a3f; text-decoration: none; border-bottom: 3px solid #ff8a3d; margin-bottom: -2px">Úlohy</a>
  </nav>

  <main style="flex: 1; padding: 10px 14px; display: flex; flex-direction: column; gap: 10px">
    <div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; background: #f3ece1; padding: 3px; border-radius: 999px">
      <a href="MobilUlohy.dc.html" style="padding: 7px 0; text-align: center; border-radius: 999px; background: #fff; font-weight: 700; font-size: 13px; color: #3b2a3f; text-decoration: none; box-shadow: 0 1px 3px rgba(60,40,30,0.15)">Nová úloha</a>
      <a href="MobilPripravene.dc.html" style="padding: 7px 0; text-align: center; border-radius: 999px; font-weight: 600; font-size: 13px; color: #6b5a70; text-decoration: none">Pripravené (3)</a>
    </div>

    <form style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 8px">
        <label style="display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 12px">Názov úlohy
          <input type="text" placeholder="Zvieratá na farme" style="height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid rgba(90,61,43,0.42); font: 400 14px Lexend, sans-serif"></label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 12px">Skupina
          <select style="height: 40px; padding: 0 8px; border-radius: 10px; border: 1px solid rgba(90,61,43,0.42); font: 400 14px Lexend, sans-serif; background: #fff; color: #3b2a3f"><option>—</option><option>[SKUPINA 1]</option><option>Nová…</option></select></label>
      </div>

      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-weight: 600; font-size: 12px">Hra</span>
        <div style="display: flex; gap: 6px; flex-wrap: wrap">
          <button type="button" style="height: 32px; padding: 0 11px; border-radius: 999px; border: 0; background: #ff8a3d; color: #3b1d05; font: 700 13px Lexend, sans-serif">Prúd slov</button>
          <button type="button" style="height: 32px; padding: 0 11px; border-radius: 999px; border: 1px solid rgba(90,61,43,0.3); background: #fff; font: 600 13px Lexend, sans-serif; color: #3b2a3f">Čakajúce slová</button>
          <button type="button" style="height: 32px; padding: 0 11px; border-radius: 999px; border: 1px solid rgba(90,61,43,0.3); background: #fff; font: 600 13px Lexend, sans-serif; color: #3b2a3f">Odpis</button>
          <button type="button" style="height: 32px; padding: 0 11px; border-radius: 999px; border: 1px solid rgba(90,61,43,0.3); background: #fff; font: 600 13px Lexend, sans-serif; color: #3b2a3f">Pás</button>
          <button type="button" style="height: 32px; padding: 0 11px; border-radius: 999px; border: 1px solid rgba(90,61,43,0.3); background: #fff; font: 600 13px Lexend, sans-serif; color: #3b2a3f">Prepis</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-weight: 600; font-size: 12px">Limit</span>
        <div style="display: flex; gap: 6px; align-items: center">
          <button type="button" style="height: 32px; padding: 0 11px; border-radius: 999px; border: 0; background: #ff8a3d; color: #3b1d05; font: 700 13px Lexend, sans-serif">Čas</button>
          <button type="button" style="height: 32px; padding: 0 11px; border-radius: 999px; border: 1px solid rgba(90,61,43,0.3); background: #fff; font: 600 13px Lexend, sans-serif; color: #3b2a3f">Text</button>
          <button type="button" style="height: 32px; padding: 0 11px; border-radius: 999px; border: 1px solid rgba(90,61,43,0.3); background: #fff; font: 600 13px Lexend, sans-serif; color: #3b2a3f">Čas aj text</button>
          <input type="text" aria-label="Dĺžka" value="5 min" style="width: 60px; height: 32px; padding: 0 8px; border-radius: 8px; border: 1px solid rgba(90,61,43,0.42); font: 400 13px Lexend, sans-serif; margin-left: auto"></div>
      </div>

      <label style="display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 12px">Slová <span style="font-weight: 400; color: #6b5a70">(jedno na riadok alebo oddelené čiarkou)</span>
        <textarea rows="3" style="padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(90,61,43,0.42); font: 400 14px Lexend, sans-serif; resize: vertical">škola, kamarát, slnko</textarea></label>

      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px">
        <input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #2e9d5b"> Použiť slovník, keď sa minie text</label>

      <button type="submit" style="height: 48px; border-radius: 999px; border: 0; background: linear-gradient(180deg, #ffa25c, #ff8a3d); color: #3b1d05; font: 700 15px Lexend, sans-serif; box-shadow: 0 3px 0 #e56a1b">Uložiť ako novú úlohu</button>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
