<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Pre učiteľov – okno Premenovať skupinu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 900px; position: relative; overflow: hidden; font-family: Lexend, system-ui, sans-serif; color: #3b2a3f">
  <dc-import name="Data" hint-size="1280px,900px"></dc-import>
  <div style="position: absolute; inset: 0; background: rgba(43,36,48,0.45); display: flex; align-items: center; justify-content: center">
    <div role="dialog" aria-modal="true" aria-labelledby="rename-title" style="width: 460px; box-sizing: border-box; background: #fffdf7; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 40px rgba(40,30,20,0.25); position: relative">
      <button type="button" aria-label="Zavrieť (Esc)" style="position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgba(90,61,43,0.3); background: #fff; color: #3b2a3f; font: 600 18px Lexend, sans-serif">×</button>
      <h2 id="rename-title" style="margin: 0; font-size: 22px">Premenovať skupinu</h2>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Skupina
        <select style="height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid rgba(90,61,43,0.42); font: 400 15px Lexend, sans-serif; background: #fff; color: #3b2a3f"><option>[SKUPINA 1]</option><option>[SKUPINA 2]</option></select></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Nový názov
        <input type="text" value="[NOVÝ NÁZOV]" style="height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(90,61,43,0.42); font: 400 15px Lexend, sans-serif"></label>
      <div style="display: flex; gap: 12px; margin-top: 6px">
        <button type="button" style="flex: 1; height: 48px; border-radius: 999px; border: 1px solid rgba(90,61,43,0.42); background: #fffdf7; color: #3b2a3f; font: 700 16px Lexend, sans-serif; box-shadow: 0 4px 0 rgba(90,61,43,0.18)">Zrušiť</button>
        <button type="button" style="flex: 1; height: 48px; border-radius: 999px; border: 0; background: linear-gradient(180deg, #ffa25c, #ff8a3d); color: #3b1d05; font: 700 16px Lexend, sans-serif; box-shadow: 0 4px 0 #e56a1b">Potvrdiť</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>

</html>
