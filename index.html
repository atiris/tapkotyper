    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TapkoTyper",
        "alternateName": ["Ťapko", "Tapko", "Ťapko Typer"],
        "url": "https://tapkotyper.com/",
        "description": "Ťapko (TapkoTyper) je pokojná príbehová hra, v ktorej sa deti naučia písať všetkými desiatimi. Slovenská aj anglická klávesnica, zadarmo, bez reklám a účtov.",
        "image": "https://tapkotyper.com/og.png",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any (web browser)",
        "inLanguage": ["sk", "en"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "audience": { "@type": "PeopleAudience", "suggestedMinAge": 10, "suggestedMaxAge": 15 },

    <link rel="icon" href="/icons/tapko-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/icons/tapko-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // The theme before the first paint, so a dark reload never flashes light; src/app/theme.ts keeps it after.
      (function () {
        var theme;
        try { theme = JSON.parse(localStorage.getItem('tapkotyper:v1') || '{}').theme; } catch (e) {}
        document.documentElement.dataset.theme = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      })();
    </script>
    <style>html[data-theme='dark'] { background: #171631; color-scheme: dark; }</style>
  </head>
  <body class="booting">
    <main id="app"><div class="boot">TapkoTyper</div></main>
    <noscript>
      <p lang="sk">TapkoTyper (Ťapko) je pokojná príbehová hra, v ktorej sa deti naučia písať všetkými desiatimi prstami na slovenskej aj anglickej klávesnici. Zadarmo, bez reklám a bez účtov. Hra potrebuje JavaScript, zapnite ho prosím v prehliadači.</p>
      <p lang="sk"><a href="/about/sk/">Základné informácie o hre</a></p>
      <p lang="en">TapkoTyper (Tapko) is a peaceful story game that teaches children to touch type with all ten fingers on a Slovak or English keyboard. Free, no ads, no accounts. The game needs JavaScript, please turn it on in your browser.</p>
      <p lang="en"><a href="/about/en/">About the game</a></p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>

  </body>
