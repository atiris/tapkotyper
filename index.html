<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TapkoTyper - a peaceful story-driven touch-typing adventure for children. No ads, no accounts." />
    <meta name="theme-color" content="#7cc79a" />
    <title>TapkoTyper</title>
    <link rel="icon" href="icons/tapko-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="icons/tapko-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // The theme before the first paint, so a dark reload never flashes light; src/app/theme.ts keeps it after.
      (function () {
        var theme;
        try { theme = JSON.parse(localStorage.getItem('tapkotyper:v1') || '{}').theme; } catch (e) {}
        document.documentElement.dataset.theme = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      })();
    </script>
    <style>html[data-theme='dark'] { background: #171631; color-scheme: dark; }</style>
  </head>
  <body class="booting">
    <main id="app"><div class="boot">TapkoTyper</div></main>
    <noscript>TapkoTyper needs JavaScript. / TapkoTyper potrebuje JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
    <script data-goatcounter="https://tapkotyper.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>
