<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pózy rúk</title>
  <link rel="stylesheet" href="./poser.css">
</head>
<body>
  <main class="stage-wrap">
    <div class="stage" id="stage">
      <svg class="keys" id="keys" aria-hidden="true"></svg>
      <canvas id="view"></canvas>
      <svg class="tips" id="tips" aria-hidden="true"></svg>
    </div>
    <p class="hint">Ťahaj krúžok na končeku prsta: do strán ho natočíš, hore a dolu ho vystrieš alebo ohneš. Ťahaj dlaňou: posunieš ruku.
      Shift a ťahanie dlaňou: otočíš ruku. Ctrl+Z vráti zmenu, Ctrl+S uloží.</p>
  </main>
  <aside class="panel">
    <section class="row">
      <label><input type="radio" name="side" value="left" checked> Ľavá</label>
      <label><input type="radio" name="side" value="right"> Pravá</label>
    </section>
    <section class="files">
      <label>Uložené <select id="saved"></select></label>
      <button id="load">Načítať</button>
      <label>Názov <input id="name" list="names" value="home" spellcheck="false"></label>
      <datalist id="names"></datalist>
      <button id="fresh" title="Nová póza zo základnej pozície tejto ruky">Nová zo základnej</button>
      <button id="mirror" title="Póza druhej ruky s týmto názvom, zrkadlená">Zrkadliť z druhej ruky</button>
      <button id="save" class="main">Uložiť SVG</button>
      <button id="remove">Zmazať</button>
      <p id="status" class="status"></p>
    </section>
    <section class="row">
      <label><input type="checkbox" id="showShade" checked> Ruka</label>
      <label><input type="checkbox" id="showLines" checked> Obrys</label>
      <label><input type="checkbox" id="showNails" checked> Nechty</label>
      <label><input type="checkbox" id="showOther" checked> Druhá ruka</label>
    </section>
    <div id="controls"></div>
  </aside>
  <script type="module" src="./poser.ts"></script>
</body>
</html>
